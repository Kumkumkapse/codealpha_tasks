<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - CodeAlpha Social</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar">
        <div class="logo">CodeAlpha</div>

        <nav>
            <a href="/">Home</a>
        </nav>
    </header>


    <main>

        <!-- Register -->
        <section class="create-post">
            <h2>Create Account</h2>

            <input
                type="text"
                id="registerName"
                placeholder="Enter your name"
            >

            <br><br>

            <input
                type="email"
                id="registerEmail"
                placeholder="Enter your email"
            >

            <br><br>

            <input
                type="password"
                id="registerPassword"
                placeholder="Create password"
            >

            <br><br>

            <button id="registerBtn">
                Register
            </button>
        </section>


        <!-- Login -->
        <section class="create-post">
            <h2>Login</h2>

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
            >

            <br><br>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
            >

            <br><br>

            <button id="loginBtn">
                Login
            </button>
        </section>

    </main>


    <script src="js/auth.js"></script>

</body>
</html>
