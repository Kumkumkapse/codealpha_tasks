<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CodeAlpha E-Commerce Store</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <div class="logo">
            CodeAlpha Store
        </div>

        <nav>
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">Cart</a>
            <a href="#">Login</a>
        </nav>
    </header>


    <!-- Hero Section -->
    <section class="hero">
        <h1>Welcome to CodeAlpha Store</h1>

        <p>
            Find amazing products at the best prices.
        </p>

        <button>Shop Now</button>
    </section>


    <!-- Products Section -->
    <section class="products">

        <h2>Our Products</h2>

        <div class="product-container" id="product-container">
</div>


    </section>


    <!-- Footer -->
    <footer>
        <p>© 2026 CodeAlpha Store. All rights reserved.</p>
    </footer>
    <section class="cart-section">
    <h2>Your Cart</h2>

    <div id="cart-items">
        <p>Your cart is empty.</p>
    </div>
</section>


    <script src="js/script.js"></script>

</body>
</html>
